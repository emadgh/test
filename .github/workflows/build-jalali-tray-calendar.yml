name: Build GahYar 2.6.5 test

on:
  push:
    branches:
      - build-jalali-tray-calendar-20260808
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Checkout GahYar 2.6.4 base
        shell: pwsh
        run: |
          git clone https://github.com/emadgh/GahYar.git GahYar
          Set-Location GahYar
          git checkout --detach 3efcef2ce7a5f8c92642094c9aaeabc208154a83

      - name: Apply exact 2.6.5 source patch
        shell: pwsh
        run: |
          function Get-TextBlob([string]$sha) {
            $response = Invoke-RestMethod "https://api.github.com/repos/emadgh/GahYar/git/blobs/$sha"
            $bytes = [Convert]::FromBase64String(($response.content -replace '\s', ''))
            return [Text.Encoding]::UTF8.GetString($bytes)
          }

          $patch = ''
          $patch += Get-TextBlob '0a1e2641944a17c37eabcceb0354c8b9592bfef6'
          $patch += Get-TextBlob '82763f508b475e575e8cac5c4a5a6b2fb89cd72c'
          $patch += Get-TextBlob 'c62fe925c619f5f9833da9ad8cd0e13afc5dbdb4'
          $patch += Get-TextBlob '5c8782e40708141878bfaf07aa7d19fede2482ff'
          [IO.File]::WriteAllText('GahYar-2.6.5.patch', $patch, [Text.UTF8Encoding]::new($false))

          $patchHash = (Get-FileHash 'GahYar-2.6.5.patch' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne 'be6c5046abecf279d66553d30186141b55dc0691f457fd340db2abe448275d96') {
            throw "Patch integrity check failed: $patchHash"
          }

          Set-Location GahYar
          python -c "from pathlib import Path; files=['src/main.rs','src/settings.rs','Cargo.toml','Cargo.lock','app.rc']; [(lambda p: p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n')))(Path(f)) for f in files]"
          git apply --whitespace=nowarn ../GahYar-2.6.5.patch

          Select-String -Path Cargo.toml -SimpleMatch 'version = "2.6.5"' | Out-Null
          Select-String -Path app.rc -SimpleMatch 'FILEVERSION 2,6,5,0' | Out-Null
          Select-String -Path src/settings.rs -SimpleMatch 'pub daily_view: bool' | Out-Null
          Select-String -Path src/main.rs -SimpleMatch 'BASE_HEIGHT_DAILY' | Out-Null
          Select-String -Path src/main.rs -SimpleMatch 'app.step_day(delta)' | Out-Null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test
        working-directory: GahYar
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build Windows x64 release
        working-directory: GahYar
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify and prepare test artifact
        shell: pwsh
        run: |
          $exe = 'GahYar/target/x86_64-pc-windows-msvc/release/GahYar.exe'
          if (!(Test-Path $exe)) { throw 'GahYar.exe was not produced' }
          $info = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion)"
          if ($info.FileVersion -notlike '2.6.5*') { throw "Unexpected FileVersion: $($info.FileVersion)" }
          if ($info.ProductVersion -notlike '2.6.5*') { throw "Unexpected ProductVersion: $($info.ProductVersion)" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $exe artifact/GahYar.exe
          Get-FileHash artifact/GahYar.exe -Algorithm SHA256 | Format-List | Out-File artifact/SHA256.txt
          'GahYar 2.6.5 TEST BUILD - not released' | Out-File artifact/BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GahYar-v2.6.5-test-win-x64
          path: artifact
          if-no-files-found: error
