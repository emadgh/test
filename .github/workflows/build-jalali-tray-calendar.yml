name: Build Jalali Tray Calendar

on:
  push:
    branches:
      - build-jalali-tray-calendar-20260808
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Decode source archive
        shell: pwsh
        run: |
          if (Test-Path source.part00.b64) {
            $b64 = (Get-ChildItem source.part*.b64 | Sort-Object Name | ForEach-Object { Get-Content -Raw $_.FullName }) -join ''
          } else {
            $b64 = Get-Content -Raw source.zip.b64
          }
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($b64))
          Expand-Archive source.zip -DestinationPath extracted -Force
      - name: Fetch unchanged app assets
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/emadgh/GahYar/main/icon/GahYar.ico' -OutFile 'extracted/JalaliTrayCalendar-Rust/icon/GahYar.ico'
          Invoke-WebRequest 'https://raw.githubusercontent.com/emadgh/GahYar/main/fonts/Vazirmatn-Regular.ttf' -OutFile 'extracted/JalaliTrayCalendar-Rust/fonts/Vazirmatn-Regular.ttf'
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release executable
        shell: pwsh
        run: |
          Set-Location extracted/JalaliTrayCalendar-Rust
          cargo test --target x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item extracted/JalaliTrayCalendar-Rust/target/x86_64-pc-windows-msvc/release/jalali-tray-calendar.exe artifact/GahYar.exe
          Copy-Item extracted/JalaliTrayCalendar-Rust/README.md artifact/README.md
          Get-FileHash artifact/GahYar.exe -Algorithm SHA256 | Format-List | Out-File artifact/SHA256.txt
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GahYar-v2.6.5-test-win-x64
          path: artifact
          if-no-files-found: error
