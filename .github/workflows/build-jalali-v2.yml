name: Build Jalali Tray Calendar v2

on:
  push:
    branches: [build-jalali-tray-calendar-v2-20260809]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and extract source archive
        shell: pwsh
        run: |
          $b64 = (Get-ChildItem chunk-* | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($b64))
          Expand-Archive source.zip -DestinationPath extracted -Force
      - name: Patch Rust borrow checker issues
        shell: pwsh
        run: |
          $path = 'extracted/JalaliTrayCalendar-Rust-v2/src/main.rs'
          $text = Get-Content $path -Raw
          $text = $text.Replace('add_month(app.settings.main_calendar, &mut app.year, &mut app.month, 1);', "let kind = app.settings.main_calendar;`n                    let (mut year, mut month) = (app.year, app.month);`n                    add_month(kind, &mut year, &mut month, 1);`n                    app.year = year;`n                    app.month = month;")
          $text = $text.Replace('add_month(app.settings.main_calendar, &mut app.year, &mut app.month, -1);', "let kind = app.settings.main_calendar;`n                    let (mut year, mut month) = (app.year, app.month);`n                    add_month(kind, &mut year, &mut month, -1);`n                    app.year = year;`n                    app.month = month;")
          $text = $text.Replace('add_month(app.settings.main_calendar, &mut app.year, &mut app.month, delta);', "let kind = app.settings.main_calendar;`n                        let (mut year, mut month) = (app.year, app.month);`n                        add_month(kind, &mut year, &mut month, delta);`n                        app.year = year;`n                        app.month = month;")
          $old = @'
                    let previous_main = app.settings.main_calendar;
                    app.settings = Settings::default();
                    if app.settings.main_calendar != previous_main {
                        app.set_main_calendar(app.settings.main_calendar);
                    }
                    app.settings.save();
'@
          $new = @'
                    let default_settings = Settings::default();
                    let next_main = default_settings.main_calendar;
                    if next_main != app.settings.main_calendar {
                        app.set_main_calendar(next_main);
                    }
                    app.settings = default_settings;
                    app.settings.save();
'@
          $text = $text.Replace($old, $new)
          Set-Content $path $text -Encoding utf8NoBOM
          $calendar = 'extracted/JalaliTrayCalendar-Rust-v2/src/calendar.rs'
          $calendarText = (Get-Content $calendar -Raw).Replace('pub fn add_month(kind: CalendarKind, year:', 'pub fn add_month(_kind: CalendarKind, year:')
          Set-Content $calendar $calendarText -Encoding utf8NoBOM
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test calendar conversions
        shell: pwsh
        run: |
          Set-Location extracted/JalaliTrayCalendar-Rust-v2
          cargo test --target x86_64-pc-windows-msvc
      - name: Build release executable
        shell: pwsh
        run: |
          Set-Location extracted/JalaliTrayCalendar-Rust-v2
          cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item extracted/JalaliTrayCalendar-Rust-v2/target/x86_64-pc-windows-msvc/release/jalali-tray-calendar.exe artifact/JalaliTrayCalendar.exe
          Copy-Item extracted/JalaliTrayCalendar-Rust-v2/README.md artifact/README.md
          Copy-Item extracted/JalaliTrayCalendar-Rust-v2/assets/iran-calendar-events-1405.json artifact/iran-calendar-events-1405.json
      - uses: actions/upload-artifact@v4
        with:
          name: JalaliTrayCalendar-v2-win-x64
          path: artifact
